name: Rider plugin

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  schedule:
    - cron: '0 0 * * 0'

jobs:
  main:
    runs-on: ${{ matrix.image }}
    strategy:
      matrix:
        image: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          path: main

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Checkout Meadow.CLI side-by-side
        uses: actions/checkout@v4
        with:
          repository: WildernessLabs/Meadow.CLI
          path: Meadow.CLI
          ref: main

      - if: ${{ github.ref != 'refs/heads/main' }}
        name: Checkout Meadow.CLI side-by-side
        uses: actions/checkout@v4
        with:
          repository: WildernessLabs/Meadow.CLI
          path: Meadow.CLI
          ref: develop

      - name: Checkout Meadow.Contracts side-by-side
        uses: actions/checkout@v4
        with:
          repository: WildernessLabs/Meadow.Contracts
          path: Meadow.Contracts
          ref: develop

      - if: matrix.image == 'ubuntu-latest'
        name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Common preparation
      - name: Prepare build
        run: ./gradlew prepare
        working-directory: ./main

      # Backend
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
      
      - name: Build Backend
        run: dotnet build -c Release
        working-directory: ./main
        
      # Distribution
      - name: Build Distribution
        run: ./gradlew -PbuildConfiguration=Release -PbuildNumber=${{ github.run_number }} buildPlugin
        working-directory: ./main

      - if: matrix.image == 'windows-latest' # for the purpose of uploading. Only on Linux to avoid zip name clash
        name: Unpack distribution 
        shell: pwsh
        run: main/scripts/Unpack-Distribution.ps1
      
      - if: matrix.image == 'windows-latest'
        name: Read pluginVersion from gradle.properties
        id: read_version
        shell: pwsh
        run: |
          $pluginVersion = Select-String -Path "gradle.properties" -Pattern "^pluginVersion=" | ForEach-Object {
            $_.Line -replace "^pluginVersion=", ""
          }
          echo "pluginVersion=$pluginVersion"
          echo "plugin_version=$pluginVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
        working-directory: ./main

      - if: matrix.image == 'windows-latest' # Only on Linux to avoid zip name clash
        name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: rider-meadow-plugin-${{ env.plugin_version }}
          path: main/build/distributions/unpacked

      # Publish
      - if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && matrix.image == 'windows-latest' }}
        name: Publish
        shell: pwsh
        run: main/scripts/Publish-Distribution.ps1 -Channel dev -AuthToken $env:JETBRAINS_MARKETPLACE_TOKEN
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

  validation:
    runs-on: ubuntu-latest
    name: "Validate Gradle wrapper"
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v3
